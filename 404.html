<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Eric Reboisson</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu principal</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#accueil">
        <span class="brand-mark" aria-hidden="true">ER</span>
        <span class="brand-name">Eric Reboisson</span>
      </a>
    </div>
  </header>

  <main id="contenu">
    <section class="section" style="padding-block: clamp(var(--sp-7), 8vw, var(--sp-9));">
      <div class="container">
        <h1 style="font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; line-height: 1.1; letter-spacing: -0.035em; color: var(--text);">Page introuvable</h1>
        <p style="margin-top: var(--sp-5); max-width: 62ch; font-size: 1.125rem; line-height: 1.6; color: var(--text-2);">
          Cette page n'existe pas. Retournez à l'accueil ou utilisez la navigation ci-dessus.
        </p>
        <p style="margin-top: var(--sp-6);">
          <a class="btn btn-primary" href="#accueil">Retour à l'accueil</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="annee">2026</span> Eric Reboisson</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
